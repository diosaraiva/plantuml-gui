# PlantUML GUI - shared configuration for the launchers and the application.
# Active copy: next to the launchers. Factory default: src/main/resources/java_config.ini.
# "Default" in the Config tab overwrites the active copy with this one.
# Format: key = value, one per line; '#' or ';' start a comment.

# Launcher settings
launcher.projectDir = plantuml-gui-java
launcher.srcDir = src/main/java
launcher.resDir = src/main/resources
launcher.outDir = bin
launcher.buildDir = target
launcher.releaseDir = release
launcher.jarName = plantuml-gui-java.jar
launcher.zipName = plantuml-gui-java.zip
launcher.mainClass = com.diosaraiva.plantumlgui.Main
launcher.cleanDirs = bin out build target output
launcher.javacRelease =

# Application settings
app.language = en-US
app.theme = javax.swing.plaf.metal.MetalLookAndFeel
app.font = Dialog
app.window.width = 1024
app.window.height = 600
app.autoPreview = true
app.previewDelayMs = 800

# PlantUML service settings; previews render into an auto-deleted system temp dir
plantuml.jarPath =
plantuml.bundledJar = plantuml/plantuml-1.2026.8.jar
plantuml.includeDir = plantuml/samples
plantuml.jvmOptions = -Djava.awt.headless=true -Dapple.awt.UIElement=true
plantuml.outputDir = output

# Export defaults; format is a PlantUmlFormat name (PNG, SVG, PUML, ARCHIMATE)
# A relative targetFile resolves inside plantuml.outputDir
export.format = PNG
export.targetFile = target.puml
